openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Versa API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: venues
    description: Venue discovery and management
  - name: bookings
    description: Booking and availability operations
  - name: admin
    description: Admin operations
  - name: subscriptions
    description: Owner plan, entitlement, and recurring billing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many login attempts; retry after the indicated delay
          headers:
            Retry-After:
              description: Minimum number of seconds to wait before trying again
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset link
      description: Always returns the same response whether or not a player account matches the email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Generic response that does not reveal whether an account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponse"
        "429":
          description: Too many reset requests
          headers:
            Retry-After:
              description: Minimum number of seconds to wait before trying again
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
        "400":
          description: Invalid, expired, or already-used reset token, or invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get current user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateProfileResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email or phone number already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/password:
    patch:
      operationId: changePassword
      tags: [auth]
      summary: Change the authenticated user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
        "400":
          description: Invalid new password or request input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Public Venue Discovery ────────────────────────────────────────────────
  /venues:
    get:
      operationId: listVenues
      tags: [venues]
      summary: List approved venues
      parameters:
        - name: district
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [INDOOR, OUTDOOR, HYBRID]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of approved venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      $ref: "#/components/schemas/VenueSummary"
                required: [venues]

  /venues/{id}:
    get:
      operationId: getVenue
      tags: [venues]
      summary: Get approved venue detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueDetail"
                required: [venue]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Owner Venue Management ────────────────────────────────────────────────
  /owner/venues:
    get:
      operationId: listOwnerVenues
      tags: [venues]
      summary: List venues owned by current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner's venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      $ref: "#/components/schemas/OwnerVenueSummary"
                required: [venues]

    post:
      operationId: createVenue
      tags: [venues]
      summary: Create a new venue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueRequest"
      responses:
        "201":
          description: Venue created
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/venues/{id}:
    get:
      operationId: getOwnerVenue
      tags: [venues]
      summary: Get owner venue detail (including pitches, hours, pricing)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueDetail"
                required: [venue]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    put:
      operationId: updateVenue
      tags: [venues]
      summary: Update a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVenueRequest"
      responses:
        "200":
          description: Venue updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]

    delete:
      operationId: deleteVenue
      tags: [venues]
      summary: Delete a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Venue deleted

  /owner/venues/{id}/submit:
    post:
      operationId: submitVenueForApproval
      tags: [venues]
      summary: Submit venue for admin approval
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]
        "400":
          description: Venue has no pitches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/venues/{id}/photos/upload:
    post:
      operationId: uploadVenuePhoto
      tags: [venues]
      summary: Upload a venue photo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/VenuePhotoUpload"
      responses:
        "201":
          description: Photo added
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    $ref: "#/components/schemas/VenuePhoto"
                required: [photo]

  /owner/venues/{id}/photos/reorder:
    put:
      operationId: reorderVenuePhotos
      tags: [venues]
      summary: Set the ordered venue-photo list
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenuePhotoOrder"
      responses:
        "200":
          description: Photo order saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePhotoOrderResult"

  /owner/venues/{venueId}/photos/{photoId}:
    delete:
      operationId: deleteVenuePhoto
      tags: [venues]
      summary: Remove a photo from a venue
      security:
        - bearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Photo deleted

  /venue-photos/{photoId}:
    get:
      operationId: getVenuePhotoFile
      tags: [venues]
      summary: Get a processed venue photo
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: preview
          in: query
          required: false
          description: Short-lived signed token used only to show an unapproved venue photo to its owner.
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: WebP venue image
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/venues/{id}/pitches:
    post:
      operationId: createPitch
      tags: [venues]
      summary: Add a pitch to a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePitchRequest"
      responses:
        "201":
          description: Pitch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  pitch:
                    $ref: "#/components/schemas/PitchRecord"
                required: [pitch]

  /owner/venues/{id}/pitches/{pitchId}:
    put:
      operationId: updatePitch
      tags: [venues]
      summary: Update a pitch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePitchRequest"
      responses:
        "200":
          description: Pitch updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  pitch:
                    $ref: "#/components/schemas/PitchRecord"
                required: [pitch]

    delete:
      operationId: deletePitch
      tags: [venues]
      summary: Delete a pitch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Pitch deleted

  /owner/venues/{id}/opening-hours:
    put:
      operationId: setOpeningHours
      tags: [venues]
      summary: Replace all opening hours for a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOpeningHoursRequest"
      responses:
        "200":
          description: Opening hours updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  openingHours:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpeningHoursRecord"
                required: [openingHours]

  /owner/venues/{id}/pitches/{pitchId}/pricing:
    put:
      operationId: setPricingRules
      tags: [venues]
      summary: Replace pricing rules for a pitch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPricingRulesRequest"
      responses:
        "200":
          description: Pricing rules updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  pricingRules:
                    type: array
                    items:
                      $ref: "#/components/schemas/PricingRuleRecord"
                required: [pricingRules]

  # ── Availability ──────────────────────────────────────────────────────────
  /venues/{venueId}/pitches/{pitchId}/availability:
    get:
      operationId: getPitchAvailability
      tags: [venues]
      summary: Get available time slots for a pitch on a given date
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: Date in YYYY-MM-DD format
      responses:
        "200":
          description: Slot availability for the date
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items:
                      $ref: "#/components/schemas/SlotItem"
                required: [slots]
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pitch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Bookings ──────────────────────────────────────────────────────────────
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking for a pitch slot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    $ref: "#/components/schemas/BookingWithDetails"
                required: [booking]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Slot no longer available (double-booking prevented)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /player/bookings:
    get:
      operationId: listPlayerBookings
      tags: [bookings]
      summary: List bookings for the logged-in player
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: Player's bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingWithDetails"
                required: [bookings]

  /player/bookings/{id}:
    get:
      operationId: getPlayerBooking
      tags: [bookings]
      summary: Get a specific booking for the logged-in player
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    $ref: "#/components/schemas/BookingWithDetails"
                required: [booking]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/bookings:
    get:
      operationId: listOwnerBookings
      tags: [bookings]
      summary: List bookings across all venues owned by the current user
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Filter bookings starting at or after this datetime
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: Filter bookings starting at or before this datetime
        - name: pitchId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by a specific pitch
      responses:
        "200":
          description: Owner's bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingWithDetails"
                required: [bookings]

  /owner/stats:
    get:
      operationId: getOwnerStats
      tags: [bookings]
      summary: Get booking and revenue analytics for the current venue owner
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
          description: ISO 8601 datetime string. Include bookings starting at or after this value.
        - name: to
          in: query
          schema:
            type: string
          description: ISO 8601 datetime string. Include bookings starting at or before this value.
      responses:
        "200":
          description: Owner booking and revenue analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerStatsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Venue owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/bookings/{id}:
    get:
      operationId: getOwnerBooking
      tags: [bookings]
      summary: Get a specific booking for the venue owner
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    allOf:
                      - $ref: "#/components/schemas/BookingWithDetails"
                      - type: object
                        properties:
                          payment:
                            nullable: true
                            allOf:
                              - $ref: "#/components/schemas/PaymentRecord"
                required: [booking]
        "403":
          description: Not your venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/bookings/{id}/audit:
    get:
      operationId: getOwnerBookingAudit
      tags: [bookings]
      summary: Get audit log for a specific booking (owner view)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Audit entries for this booking
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                required: [entries]
        "403":
          description: Not your venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/venues/{venueId}/pitches/{pitchId}/blocks:
    post:
      operationId: createMaintenanceBlock
      tags: [bookings]
      summary: Block a pitch slot for maintenance
      security:
        - bearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaintenanceBlockRequest"
      responses:
        "201":
          description: Maintenance block created
          content:
            application/json:
              schema:
                type: object
                properties:
                  block:
                    $ref: "#/components/schemas/MaintenanceBlock"
                required: [block]

  /owner/venues/{venueId}/pitches/{pitchId}/blocks/{blockId}:
    delete:
      operationId: deleteMaintenanceBlock
      tags: [bookings]
      summary: Remove a maintenance block
      security:
        - bearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: blockId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Block deleted

  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking (player cancels own, owner cancels at their venue)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingRequest"
      responses:
        "200":
          description: Booking cancelled, refund issued if applicable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelBookingResponse"
        "400":
          description: Cannot cancel (outside window or wrong status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorised to cancel this booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Admin Endpoints ───────────────────────────────────────────────────────
  /admin/venues:
    get:
      operationId: adminListVenues
      tags: [admin]
      summary: List all venues (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        "200":
          description: All venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminVenueSummary"
                required: [venues]

  /admin/venues/{id}:
    get:
      operationId: adminGetVenue
      tags: [admin]
      summary: Get full venue detail (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/AdminVenueDetail"
                required: [venue]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/venues/{id}/approve:
    put:
      operationId: approveVenue
      tags: [admin]
      summary: Approve a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/venues/{id}/reject:
    put:
      operationId: rejectVenue
      tags: [admin]
      summary: Reject a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectVenueRequest"
      responses:
        "200":
          description: Venue rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/venues/{id}/disable:
    put:
      operationId: adminDisableVenue
      tags: [admin]
      summary: Disable an approved venue (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Venue disabled
          content:
            application/json:
              schema:
                type: object
                required: [venue]
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all non-admin users (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                required: [users, total, page, limit]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUserRecord"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/bookings:
    get:
      operationId: adminListBookings
      tags: [admin]
      summary: List all bookings across all venues (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: object
                required: [bookings]
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingWithDetails"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/bookings/{id}:
    get:
      operationId: adminGetBooking
      tags: [admin]
      summary: Get a single booking detail (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking:
                    $ref: "#/components/schemas/BookingWithDetails"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/bookings/{id}/audit:
    get:
      operationId: adminGetBookingAudit
      tags: [admin]
      summary: Get full audit trail for a booking (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Audit trail entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/bookings/{id}/refund:
    post:
      operationId: adminRefundBooking
      tags: [admin]
      summary: Force-refund any booking regardless of cancellation policy (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingRequest"
      responses:
        "200":
          description: Booking cancelled and refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelBookingResponse"
        "400":
          description: Booking already cancelled/refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Checkout & Payments ────────────────────────────────────────────────────
  /checkout/fee:
    get:
      operationId: getCheckoutFee
      tags: [bookings]
      summary: Get current platform fee for a venue
      security:
        - bearerAuth: []
      parameters:
        - name: venueId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Fee details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutFeeResponse"

  /bookings/{bookingId}/checkout:
    post:
      operationId: checkoutBooking
      tags: [bookings]
      summary: Pay for a PENDING booking (MockPaymentProvider)
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Payment succeeded, booking confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "402":
          description: Payment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Booking already confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /bookings/{bookingId}/payment:
    get:
      operationId: getBookingPayment
      tags: [bookings]
      summary: Get the payment record for a booking
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment record
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    $ref: "#/components/schemas/PaymentRecord"
                required: [payment]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Push Token ────────────────────────────────────────────────────────────
  /auth/push-token:
    patch:
      operationId: registerPushToken
      tags: [auth]
      summary: Register or update Expo push token for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenRequest"
      responses:
        "200":
          description: Push token registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  # ── Admin Settings ────────────────────────────────────────────────────────
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get global admin settings (fee, overrides)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: "#/components/schemas/AdminSettingsRecord"
                required: [settings]
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update global fee settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: "#/components/schemas/AdminSettingsRecord"
                required: [settings]

  /admin/settings/venues/{venueId}:
    patch:
      operationId: setVenueFeeOverride
      tags: [admin]
      summary: Set or clear per-venue fee override
      security:
        - bearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueFeeOverrideRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: "#/components/schemas/AdminSettingsRecord"
                required: [settings]

  # ── Owner subscriptions ───────────────────────────────────────────────────
  /owner/subscription:
    get:
      operationId: getOwnerSubscription
      tags: [subscriptions]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current server-authoritative owner subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    $ref: "#/components/schemas/OwnerSubscription"
                required: [subscription]

  /owner/subscription/checkout:
    post:
      operationId: createOwnerSubscriptionCheckout
      tags: [subscriptions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCheckoutInput"
      responses:
        "201":
          description: Recurring checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUrl"
        "503":
          description: Recurring billing is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/subscription/portal:
    post:
      operationId: createOwnerBillingPortal
      tags: [subscriptions]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing portal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUrl"

  /owner/subscription/cancel:
    post:
      operationId: cancelOwnerSubscription
      tags: [subscriptions]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cancellation scheduled for period end
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    $ref: "#/components/schemas/OwnerSubscription"
                required: [subscription]

  /admin/subscriptions/owners:
    get:
      operationId: listOwnerSubscriptions
      tags: [admin, subscriptions]
      security:
        - bearerAuth: []
      parameters:
        - name: plan
          in: query
          schema:
            $ref: "#/components/schemas/SubscriptionPlan"
      responses:
        "200":
          description: Venue owners with effective plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  owners:
                    type: array
                    items:
                      $ref: "#/components/schemas/OwnerSubscriptionSummary"
                required: [owners]

  /admin/subscriptions/owners/{ownerId}:
    get:
      operationId: getOwnerSubscriptionAdmin
      tags: [admin, subscriptions]
      security:
        - bearerAuth: []
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Owner subscription and audit history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSubscriptionAdminDetail"

  /admin/subscriptions/owners/{ownerId}/override:
    put:
      operationId: setOwnerSubscriptionOverride
      tags: [admin, subscriptions]
      security:
        - bearerAuth: []
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionOverrideInput"
      responses:
        "200":
          description: Override updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    $ref: "#/components/schemas/OwnerSubscription"
                required: [subscription]

  /webhooks/stripe/subscriptions:
    post:
      operationId: receiveStripeSubscriptionWebhook
      tags: [subscriptions]
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                required: [received]
        "400":
          description: Signature verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SubscriptionPlan:
      type: string
      enum: [FREE, PRO, ELITE]

    SubscriptionStatus:
      type: string
      enum: [NONE, INCOMPLETE, ACTIVE, PAST_DUE, UNPAID, CANCELED, PAUSED]

    OwnerSubscription:
      type: object
      properties:
        plan:
          $ref: "#/components/schemas/SubscriptionPlan"
        effectivePlan:
          $ref: "#/components/schemas/SubscriptionPlan"
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        currentPeriodStart:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
        overridePlan:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SubscriptionPlan"
        overrideReason:
          type: string
          nullable: true
        overrideStartsAt:
          type: string
          format: date-time
          nullable: true
        overrideEndsAt:
          type: string
          format: date-time
          nullable: true
        capabilities:
          type: array
          items:
            type: string
            enum: [MANUAL_BOOKING, ADVANCED_ANALYTICS]
        billingConfigured:
          type: boolean
      required: [plan, effectivePlan, status, currentPeriodStart, currentPeriodEnd, cancelAtPeriodEnd, overridePlan, overrideReason, overrideStartsAt, overrideEndsAt, capabilities, billingConfigured]

    SubscriptionCheckoutInput:
      type: object
      properties:
        plan:
          type: string
          enum: [PRO, ELITE]
      required: [plan]
      additionalProperties: false

    BillingUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
      required: [url]

    OwnerSubscriptionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        subscription:
          $ref: "#/components/schemas/OwnerSubscription"
      required: [id, name, email, createdAt, subscription]

    SubscriptionEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
          nullable: true
        actorUserId:
          type: string
          format: uuid
          nullable: true
        providerEventId:
          type: string
          nullable: true
        eventType:
          type: string
        previousValue:
          type: object
          nullable: true
          additionalProperties: true
        newValue:
          type: object
          nullable: true
          additionalProperties: true
        reason:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
      required: [id, ownerId, actorUserId, providerEventId, eventType, metadata, occurredAt, processedAt]

    OwnerSubscriptionAdminDetail:
      type: object
      properties:
        owner:
          $ref: "#/components/schemas/OwnerSubscriptionSummary"
        events:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionEvent"
      required: [owner, events]

    SubscriptionOverrideInput:
      type: object
      properties:
        plan:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SubscriptionPlan"
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
      required: [plan, reason]
      additionalProperties: false

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
        field:
          type: string
          description: Request field associated with a validation or uniqueness error.
      required: [error]

    AuditEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        actorUserId:
          type: string
          nullable: true
        actorRole:
          type: string
          nullable: true
        actorName:
          type: string
          nullable: true
        previousValue:
          type: object
          nullable: true
          additionalProperties: true
        newValue:
          type: object
          nullable: true
          additionalProperties: true
        notes:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    UserRole:
      type: string
      enum: [PLAYER, VENUE_OWNER, ADMIN]

    VenueStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, DISABLED]

    PitchType:
      type: string
      enum: [INDOOR, OUTDOOR, HYBRID]

    DayType:
      type: string
      enum: [WEEKDAY, WEEKEND, ALL]


    # ── Cancellations ────────────────────────────────────────────────────────

    CancelBookingRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 1000
          description: Optional cancellation reason

    RefundResult:
      type: object
      properties:
        refundId:
          type: string
          nullable: true
        amount:
          type: string
        currency:
          type: string
        status:
          type: string
          enum: [SUCCEEDED, FAILED, PENDING]
      required: [amount, currency, status]

    CancelBookingResponse:
      type: object
      properties:
        booking:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/BookingStatus"
            cancellationReason:
              type: string
              nullable: true
          required: [id, status]
        refund:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RefundResult"
        refundEligible:
          type: boolean
          description: Whether the booking was within the cancellation window and eligible for a refund.
        windowHours:
          type: number
          description: The cancellation window in hours that applied to this booking.
        hoursUntilStart:
          type: number
          description: Hours remaining until the booking start at the time of cancellation.
      required: [booking]

    # ── Checkout & Payments ──────────────────────────────────────────────────

    CheckoutFeeResponse:
      type: object
      properties:
        feeEnabled:
          type: boolean
        feePercent:
          type: string
          description: Percentage of the booking subtotal charged as a service fee, e.g. "6.00" or "0.00"
      required: [feeEnabled, feePercent]

    CheckoutRequest:
      type: object
      properties:
        paymentType:
          type: string
          enum: [FULL, DEPOSIT]
          default: FULL
        idempotencyKey:
          type: string
          nullable: true
      required: [paymentType]

    PaymentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: string
        feeAmount:
          type: string
        feePercent:
          type: string
          description: The percentage rate applied to compute feeAmount at checkout time, e.g. "6.00"
        feeWaived:
          type: boolean
        paymentType:
          type: string
          enum: [FULL, DEPOSIT]
        currency:
          type: string
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, REFUNDED, PARTIALLY_REFUNDED]
        provider:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, amount, feeAmount, feePercent, feeWaived, paymentType, currency, status, provider, createdAt]

    CheckoutResponse:
      type: object
      properties:
        alreadyProcessed:
          type: boolean
        booking:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
          required: [id, status]
        payment:
          $ref: "#/components/schemas/PaymentRecord"
      required: [booking, payment]


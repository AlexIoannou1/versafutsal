      type: string
      minLength: 1
      maxLength: 256
      description: Existing credential input. This is intentionally separate from new-password requirements so legacy accounts can sign in.

    NewPassword:
      type: string
      minLength: 8
      maxLength: 256
      description: New password. Must not contain control characters or match the locally maintained common-password denylist. Twelve or more characters are recommended.


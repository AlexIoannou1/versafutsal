openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FutsalCY API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: venues
    description: Venue discovery and management
  - name: bookings
    description: Booking and availability operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get current user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Public Venue Discovery ────────────────────────────────────────────────
  /venues:
    get:
      operationId: listVenues
      tags: [venues]
      summary: List approved venues
      parameters:
        - name: district
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [INDOOR, OUTDOOR, HYBRID]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of approved venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      $ref: "#/components/schemas/VenueSummary"
                required: [venues]

  /venues/{id}:
    get:
      operationId: getVenue
      tags: [venues]
      summary: Get approved venue detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueDetail"
                required: [venue]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Owner Venue Management ────────────────────────────────────────────────
  /owner/venues:
    get:
      operationId: listOwnerVenues
      tags: [venues]
      summary: List venues owned by current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner's venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      $ref: "#/components/schemas/OwnerVenueSummary"
                required: [venues]

    post:
      operationId: createVenue
      tags: [venues]
      summary: Create a new venue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueRequest"
      responses:
        "201":
          description: Venue created
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/venues/{id}:
    get:
      operationId: getOwnerVenue
      tags: [venues]
      summary: Get owner venue detail (including pitches, hours, pricing)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueDetail"
                required: [venue]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    put:
      operationId: updateVenue
      tags: [venues]
      summary: Update a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVenueRequest"
      responses:
        "200":
          description: Venue updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]

    delete:
      operationId: deleteVenue
      tags: [venues]
      summary: Delete a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Venue deleted

  /owner/venues/{id}/submit:
    post:
      operationId: submitVenueForApproval
      tags: [venues]
      summary: Submit venue for admin approval
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]
        "400":
          description: Venue has no pitches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/venues/{id}/photos:
    post:
      operationId: addVenuePhoto
      tags: [venues]
      summary: Add a photo URL to a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddVenuePhotoRequest"
      responses:
        "201":
          description: Photo added
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    $ref: "#/components/schemas/VenuePhoto"
                required: [photo]

  /owner/venues/{venueId}/photos/{photoId}:
    delete:
      operationId: deleteVenuePhoto
      tags: [venues]
      summary: Remove a photo from a venue
      security:
        - bearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Photo deleted

  /owner/venues/{id}/pitches:
    post:
      operationId: createPitch
      tags: [venues]
      summary: Add a pitch to a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePitchRequest"
      responses:
        "201":
          description: Pitch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  pitch:
                    $ref: "#/components/schemas/PitchRecord"
                required: [pitch]

  /owner/venues/{id}/pitches/{pitchId}:
    put:
      operationId: updatePitch
      tags: [venues]
      summary: Update a pitch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePitchRequest"
      responses:
        "200":
          description: Pitch updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  pitch:
                    $ref: "#/components/schemas/PitchRecord"
                required: [pitch]

    delete:
      operationId: deletePitch
      tags: [venues]
      summary: Delete a pitch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Pitch deleted

  /owner/venues/{id}/opening-hours:
    put:
      operationId: setOpeningHours
      tags: [venues]
      summary: Replace all opening hours for a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOpeningHoursRequest"
      responses:
        "200":
          description: Opening hours updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  openingHours:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpeningHoursRecord"
                required: [openingHours]

  /owner/venues/{id}/pitches/{pitchId}/pricing:
    put:
      operationId: setPricingRules
      tags: [venues]
      summary: Replace pricing rules for a pitch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPricingRulesRequest"
      responses:
        "200":
          description: Pricing rules updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  pricingRules:
                    type: array
                    items:
                      $ref: "#/components/schemas/PricingRuleRecord"
                required: [pricingRules]

  # ── Availability ──────────────────────────────────────────────────────────
  /venues/{venueId}/pitches/{pitchId}/availability:
    get:
      operationId: getPitchAvailability
      tags: [venues]
      summary: Get available time slots for a pitch on a given date
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: Date in YYYY-MM-DD format
      responses:
        "200":
          description: Slot availability for the date
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items:
                      $ref: "#/components/schemas/SlotItem"
                required: [slots]
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pitch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Bookings ──────────────────────────────────────────────────────────────
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking for a pitch slot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    $ref: "#/components/schemas/BookingWithDetails"
                required: [booking]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Slot no longer available (double-booking prevented)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /player/bookings:
    get:
      operationId: listPlayerBookings
      tags: [bookings]
      summary: List bookings for the logged-in player
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: Player's bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingWithDetails"
                required: [bookings]

  /player/bookings/{id}:
    get:
      operationId: getPlayerBooking
      tags: [bookings]
      summary: Get a specific booking for the logged-in player
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    $ref: "#/components/schemas/BookingWithDetails"
                required: [booking]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/bookings:
    get:
      operationId: listOwnerBookings
      tags: [bookings]
      summary: List bookings across all venues owned by the current user
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Filter bookings starting at or after this datetime
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: Filter bookings starting at or before this datetime
        - name: pitchId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by a specific pitch
      responses:
        "200":
          description: Owner's bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingWithDetails"
                required: [bookings]

  /owner/bookings/{id}:
    get:
      operationId: getOwnerBooking
      tags: [bookings]
      summary: Get a specific booking for the venue owner
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    $ref: "#/components/schemas/BookingWithDetails"
                required: [booking]
        "403":
          description: Not your venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/venues/{venueId}/pitches/{pitchId}/blocks:
    post:
      operationId: createMaintenanceBlock
      tags: [bookings]
      summary: Block a pitch slot for maintenance
      security:
        - bearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaintenanceBlockRequest"
      responses:
        "201":
          description: Maintenance block created
          content:
            application/json:
              schema:
                type: object
                properties:
                  block:
                    $ref: "#/components/schemas/MaintenanceBlock"
                required: [block]

  /owner/venues/{venueId}/pitches/{pitchId}/blocks/{blockId}:
    delete:
      operationId: deleteMaintenanceBlock
      tags: [bookings]
      summary: Remove a maintenance block
      security:
        - bearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: blockId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Block deleted

  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking (player cancels own, owner cancels at their venue)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingRequest"
      responses:
        "200":
          description: Booking cancelled, refund issued if applicable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelBookingResponse"
        "400":
          description: Cannot cancel (outside window or wrong status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorised to cancel this booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Admin Endpoints ───────────────────────────────────────────────────────
  /admin/venues:
    get:
      operationId: adminListVenues
      tags: [admin]
      summary: List all venues (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        "200":
          description: All venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminVenueSummary"
                required: [venues]

  /admin/venues/{id}:
    get:
      operationId: adminGetVenue
      tags: [admin]
      summary: Get full venue detail (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/AdminVenueSummary"
                required: [venue]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/venues/{id}/approve:
    put:
      operationId: approveVenue
      tags: [admin]
      summary: Approve a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/venues/{id}/reject:
    put:
      operationId: rejectVenue
      tags: [admin]
      summary: Reject a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectVenueRequest"
      responses:
        "200":
          description: Venue rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/bookings:
    get:
      operationId: adminListBookings
      tags: [admin]
      summary: List all bookings across all venues (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: object
                required: [bookings]
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingWithDetails"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/bookings/{id}:
    get:
      operationId: adminGetBooking
      tags: [admin]
      summary: Get a single booking detail (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking:
                    $ref: "#/components/schemas/BookingWithDetails"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/bookings/{id}/refund:
    post:
      operationId: adminRefundBooking
      tags: [admin]
      summary: Force-refund any booking regardless of cancellation policy (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingRequest"
      responses:
        "200":
          description: Booking cancelled and refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelBookingResponse"
        "400":
          description: Booking already cancelled/refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Checkout & Payments ────────────────────────────────────────────────────
  /checkout/fee:
    get:
      operationId: getCheckoutFee
      tags: [bookings]
      summary: Get current platform fee for a venue
      security:
        - bearerAuth: []
      parameters:
        - name: venueId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Fee details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutFeeResponse"

  /bookings/{bookingId}/checkout:
    post:
      operationId: checkoutBooking
      tags: [bookings]
      summary: Pay for a PENDING booking (MockPaymentProvider)
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Payment succeeded, booking confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "402":
          description: Payment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Booking already confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /bookings/{bookingId}/payment:
    get:
      operationId: getBookingPayment
      tags: [bookings]
      summary: Get the payment record for a booking
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment record
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    $ref: "#/components/schemas/PaymentRecord"
                required: [payment]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Push Token ────────────────────────────────────────────────────────────
  /auth/push-token:
    patch:
      operationId: registerPushToken
      tags: [auth]
      summary: Register or update Expo push token for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenRequest"
      responses:
        "200":
          description: Push token registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  # ── Admin Settings ────────────────────────────────────────────────────────
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get global admin settings (fee, overrides)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: "#/components/schemas/AdminSettingsRecord"
                required: [settings]
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update global fee settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: "#/components/schemas/AdminSettingsRecord"
                required: [settings]

  /admin/settings/venues/{venueId}:
    patch:
      operationId: setVenueFeeOverride
      tags: [admin]
      summary: Set or clear per-venue fee override
      security:
        - bearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueFeeOverrideRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: "#/components/schemas/AdminSettingsRecord"
                required: [settings]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    UserRole:
      type: string
      enum: [PLAYER, VENUE_OWNER, ADMIN]

    VenueStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    PitchType:
      type: string
      enum: [INDOOR, OUTDOOR, HYBRID]

    DayType:
      type: string
      enum: [WEEKDAY, WEEKEND, ALL]

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time
      required: [id, email, name, role, createdAt]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
        role:
          type: string
          enum: [PLAYER, VENUE_OWNER]
          description: >
            Public registration only allows PLAYER or VENUE_OWNER.
            ADMIN accounts must be created via seed or a protected admin API.
        phoneNumber:
          type: string
          nullable: true
          description: >
            Required for VENUE_OWNER registrations so the platform can verify
            the business before approving venues. Optional for PLAYERs.
      required: [email, password, name]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        token:
          type: string
      required: [user, token]

    MeResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            userId:
              type: string
            email:
              type: string
            role:
              $ref: "#/components/schemas/UserRole"
          required: [userId, email, role]
      required: [user]

    VenueRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/VenueStatus"
        name:
          type: string
        district:
          type: string
        address:
          type: string
        description:
          type: string
          nullable: true
        amenities:
          type: array
          items:
            type: string
        cancellationWindowHours:
          type: integer
        contactPhone:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, ownerId, status, name, district, address, amenities, cancellationWindowHours, createdAt, updatedAt]

    VenuePhoto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        url:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, venueId, url, sortOrder, createdAt]

    PitchRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        name:
          type: string
        size:
          type: string
        type:
          $ref: "#/components/schemas/PitchType"
        slotDurationMinutes:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, venueId, name, size, type, slotDurationMinutes, createdAt]

    PricingRuleRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pitchId:
          type: string
          format: uuid
        dayType:
          $ref: "#/components/schemas/DayType"
        pricePerHour:
          type: string
        depositType:
          type: string
        depositAmount:
          type: string
          nullable: true
      required: [id, pitchId, dayType, pricePerHour, depositType]

    PitchWithPricing:
      allOf:
        - $ref: "#/components/schemas/PitchRecord"
        - type: object
          properties:
            pricingRules:
              type: array
              items:
                $ref: "#/components/schemas/PricingRuleRecord"
            maintenanceBlocks:
              type: array
              items:
                $ref: "#/components/schemas/MaintenanceBlock"
          required: [pricingRules, maintenanceBlocks]

    OpeningHoursRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        openTime:
          type: string
        closeTime:
          type: string
        isClosed:
          type: boolean
      required: [id, venueId, dayOfWeek, openTime, closeTime, isClosed]

    OpeningHoursInput:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        openTime:
          type: string
        closeTime:
          type: string
        isClosed:
          type: boolean
      required: [dayOfWeek, openTime, closeTime, isClosed]

    PricingRuleInput:
      type: object
      properties:
        dayType:
          $ref: "#/components/schemas/DayType"
        pricePerHour:
          type: string
        depositType:
          type: string
        depositAmount:
          type: string
          nullable: true
      required: [dayType, pricePerHour, depositType]

    VenueSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        district:
          type: string
        address:
          type: string
        amenities:
          type: array
          items:
            type: string
        coverPhoto:
          type: string
          nullable: true
        minPrice:
          type: number
          nullable: true
        maxPrice:
          type: number
          nullable: true
        pitchTypes:
          type: array
          items:
            $ref: "#/components/schemas/PitchType"
        status:
          $ref: "#/components/schemas/VenueStatus"
        createdAt:
          type: string
          format: date-time
      required: [id, name, district, address, amenities, pitchTypes, status, createdAt]

    OwnerVenueSummary:
      allOf:
        - $ref: "#/components/schemas/VenueSummary"
        - type: object
          properties:
            pitchCount:
              type: integer
            rejectionReason:
              type: string
              nullable: true
          required: [pitchCount]

    VenueDetail:
      allOf:
        - $ref: "#/components/schemas/VenueRecord"
        - type: object
          properties:
            photos:
              type: array
              items:
                $ref: "#/components/schemas/VenuePhoto"
            pitches:
              type: array
              items:
                $ref: "#/components/schemas/PitchWithPricing"
            openingHours:
              type: array
              items:
                $ref: "#/components/schemas/OpeningHoursRecord"
          required: [photos, pitches, openingHours]

    AdminVenueSummary:
      allOf:
        - $ref: "#/components/schemas/VenueRecord"
        - type: object
          properties:
            owner:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                email:
                  type: string
                  format: email
              nullable: true
          required: []

    CreateVenueRequest:
      type: object
      properties:
        name:
          type: string
        district:
          type: string
        address:
          type: string
        description:
          type: string
        amenities:
          type: array
          items:
            type: string
        cancellationWindowHours:
          type: integer
          default: 24
        contactPhone:
          type: string
      required: [name, district, address, contactPhone]

    UpdateVenueRequest:
      type: object
      properties:
        name:
          type: string
        district:
          type: string
        address:
          type: string
        description:
          type: string
        amenities:
          type: array
          items:
            type: string
        cancellationWindowHours:
          type: integer
        contactPhone:
          type: string

    CreatePitchRequest:
      type: object
      properties:
        name:
          type: string
        size:
          type: string
        type:
          $ref: "#/components/schemas/PitchType"
        slotDurationMinutes:
          type: integer
          default: 60
      required: [name, size]

    UpdatePitchRequest:
      type: object
      properties:
        name:
          type: string
        size:
          type: string
        type:
          $ref: "#/components/schemas/PitchType"
        slotDurationMinutes:
          type: integer

    AddVenuePhotoRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        sortOrder:
          type: integer
      required: [url]

    SetOpeningHoursRequest:
      type: object
      properties:
        hours:
          type: array
          items:
            $ref: "#/components/schemas/OpeningHoursInput"
      required: [hours]

    SetPricingRulesRequest:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PricingRuleInput"
      required: [rules]

    RejectVenueRequest:
      type: object
      properties:
        reason:
          type: string

    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, REFUNDED, NO_SHOW]

    SlotItem:
      type: object
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        available:
          type: boolean
        reason:
          type: string
          nullable: true
          description: Why the slot is unavailable (booked | maintenance)
      required: [startAt, endAt, available]

    BookingRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        pitchId:
          type: string
          format: uuid
        playerId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/BookingStatus"
        policySnapshot:
          type: object
        cancellationReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, venueId, pitchId, playerId, startAt, endAt, status, policySnapshot, createdAt, updatedAt]

    BookingVenueSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        district:
          type: string
        address:
          type: string
      required: [id, name, district, address]

    BookingPitchSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/PitchType"
        size:
          type: string
        slotDurationMinutes:
          type: integer
      required: [id, name, type, size, slotDurationMinutes]

    BookingPlayerSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
      required: [id, name, email]

    BookingWithDetails:
      allOf:
        - $ref: "#/components/schemas/BookingRecord"
        - type: object
          properties:
            venue:
              $ref: "#/components/schemas/BookingVenueSummary"
            pitch:
              $ref: "#/components/schemas/BookingPitchSummary"
            player:
              $ref: "#/components/schemas/BookingPlayerSummary"
          required: [venue, pitch, player]

    MaintenanceBlock:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pitchId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, pitchId, startAt, endAt, createdAt]

    CreateBookingRequest:
      type: object
      properties:
        pitchId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp for the slot start
      required: [pitchId, startAt]

    CreateMaintenanceBlockRequest:
      type: object
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        reason:
          type: string
      required: [startAt, endAt]

    # ── Cancellations ────────────────────────────────────────────────────────

    CancelBookingRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          description: Optional cancellation reason

    RefundResult:
      type: object
      properties:
        refundId:
          type: string
          nullable: true
        amount:
          type: string
        currency:
          type: string
        status:
          type: string
          enum: [SUCCEEDED, FAILED, PENDING]
      required: [amount, currency, status]

    CancelBookingResponse:
      type: object
      properties:
        booking:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/BookingStatus"
            cancellationReason:
              type: string
              nullable: true
          required: [id, status]
        refund:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RefundResult"
        refundEligible:
          type: boolean
          description: Whether the booking was within the cancellation window and eligible for a refund.
        windowHours:
          type: number
          description: The cancellation window in hours that applied to this booking.
        hoursUntilStart:
          type: number
          description: Hours remaining until the booking start at the time of cancellation.
      required: [booking]

    # ── Checkout & Payments ──────────────────────────────────────────────────

    CheckoutFeeResponse:
      type: object
      properties:
        feeEnabled:
          type: boolean
        feePercent:
          type: string
          description: Percentage of the booking subtotal charged as a service fee, e.g. "6.00" or "0.00"
      required: [feeEnabled, feePercent]

    CheckoutRequest:
      type: object
      properties:
        paymentType:
          type: string
          enum: [FULL, DEPOSIT]
          default: FULL
        idempotencyKey:
          type: string
          nullable: true
      required: [paymentType]

    PaymentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: string
        feeAmount:
          type: string
        feeWaived:
          type: boolean
        paymentType:
          type: string
          enum: [FULL, DEPOSIT]
        currency:
          type: string
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, REFUNDED, PARTIALLY_REFUNDED]
        provider:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, amount, feeAmount, feeWaived, paymentType, currency, status, provider, createdAt]

    CheckoutResponse:
      type: object
      properties:
        alreadyProcessed:
          type: boolean
        booking:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
          required: [id, status]
        payment:
          $ref: "#/components/schemas/PaymentRecord"
      required: [booking, payment]

    # ── Push Token ───────────────────────────────────────────────────────────

    RegisterPushTokenRequest:
      type: object
      properties:
        pushToken:
          type: string
          description: Expo push token, e.g. ExponentPushToken[...]
      required: [pushToken]

    # ── Admin Settings ────────────────────────────────────────────────────────

    AdminSettingsRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        feeEnabled:
          type: boolean
        feePercent:
          type: string
          description: Percentage of the booking subtotal charged as a service fee, e.g. "6.00"
        perVenueOverrides:
          type: object
          additionalProperties:
            type: boolean
          description: Map of venueId to feeEnabled override
        updatedAt:
          type: string
          format: date-time
      required: [id, feeEnabled, feePercent, perVenueOverrides, updatedAt]

    UpdateAdminSettingsRequest:
      type: object
      properties:
        feeEnabled:
          type: boolean
        feePercent:
          type: string

    VenueFeeOverrideRequest:
      type: object
      properties:
        feeEnabled:
          type: boolean
          nullable: true
          description: "true = fee on, false = fee off, null = remove override"

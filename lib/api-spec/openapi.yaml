openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Versa API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: venues
    description: Venue discovery and management
  - name: bookings
    description: Booking and availability operations
  - name: admin
    description: Admin operations
  - name: subscriptions
    description: Owner plan, entitlement, and recurring billing operations
  - name: match-statistics
    description: Completed-booking match results and player performance statistics
  - name: tournaments
    description: Elite tournament management, registration, payments, and brackets
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many login attempts; retry after the indicated delay
          headers:
            Retry-After:
              description: Minimum number of seconds to wait before trying again
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset link
      description: Always returns the same response whether or not a player account matches the email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Generic response that does not reveal whether an account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponse"
        "429":
          description: Too many reset requests
          headers:
            Retry-After:
              description: Minimum number of seconds to wait before trying again
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
        "400":
          description: Invalid, expired, or already-used reset token, or invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get current user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateProfileResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email or phone number already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/password:
    patch:
      operationId: changePassword
      tags: [auth]
      summary: Change the authenticated user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
        "400":
          description: Invalid new password or request input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Public Venue Discovery ────────────────────────────────────────────────
  /venues:
    get:
      operationId: listVenues
      tags: [venues]
      summary: List approved venues
      parameters:
        - name: district
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [INDOOR, OUTDOOR, HYBRID]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of approved venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      $ref: "#/components/schemas/VenueSummary"
                required: [venues]

  /venues/{id}:
    get:
      operationId: getVenue
      tags: [venues]
      summary: Get approved venue detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueDetail"
                required: [venue]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Owner Venue Management ────────────────────────────────────────────────
  /owner/venues:
    get:
      operationId: listOwnerVenues
      tags: [venues]
      summary: List venues owned by current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner's venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      $ref: "#/components/schemas/OwnerVenueSummary"
                required: [venues]

    post:
      operationId: createVenue
      tags: [venues]
      summary: Create a new venue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueRequest"
      responses:
        "201":
          description: Venue created
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/venues/{id}:
    get:
      operationId: getOwnerVenue
      tags: [venues]
      summary: Get owner venue detail (including pitches, hours, pricing)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueDetail"
                required: [venue]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    put:
      operationId: updateVenue
      tags: [venues]
      summary: Update a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVenueRequest"
      responses:
        "200":
          description: Venue updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]

    delete:
      operationId: deleteVenue
      tags: [venues]
      summary: Delete a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Venue deleted

  /owner/venues/{id}/submit:
    post:
      operationId: submitVenueForApproval
      tags: [venues]
      summary: Submit venue for admin approval
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    $ref: "#/components/schemas/VenueRecord"
                required: [venue]
        "400":
          description: Venue has no pitches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/venues/{id}/photos/upload:
    post:
      operationId: uploadVenuePhoto
      tags: [venues]
      summary: Upload a venue photo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/VenuePhotoUpload"
      responses:
        "201":
          description: Photo added
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    $ref: "#/components/schemas/VenuePhoto"
                required: [photo]

  /owner/venues/{id}/photos/reorder:
    put:
      operationId: reorderVenuePhotos
      tags: [venues]
      summary: Set the ordered venue-photo list
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenuePhotoOrder"
      responses:
        "200":
          description: Photo order saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePhotoOrderResult"

  /owner/venues/{venueId}/photos/{photoId}:
    delete:
      operationId: deleteVenuePhoto
      tags: [venues]
      summary: Remove a photo from a venue
      security:
        - bearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Photo deleted

  /venue-photos/{photoId}:
    get:
      operationId: getVenuePhotoFile
      tags: [venues]
      summary: Get a processed venue photo
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: preview
          in: query
          required: false
          description: Short-lived signed token used only to show an unapproved venue photo to its owner.
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: WebP venue image
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/venues/{id}/pitches:
    post:
      operationId: createPitch
      tags: [venues]
      summary: Add a pitch to a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePitchRequest"
      responses:
        "201":
          description: Pitch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  pitch:
                    $ref: "#/components/schemas/PitchRecord"
                required: [pitch]

  /owner/venues/{id}/pitches/{pitchId}:
    put:
      operationId: updatePitch
      tags: [venues]
      summary: Update a pitch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePitchRequest"
      responses:
        "200":
          description: Pitch updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  pitch:
                    $ref: "#/components/schemas/PitchRecord"
                required: [pitch]

    delete:
      operationId: deletePitch
      tags: [venues]
      summary: Delete a pitch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Pitch deleted

  /owner/venues/{id}/opening-hours:
    put:
      operationId: setOpeningHours
      tags: [venues]
      summary: Replace all opening hours for a venue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOpeningHoursRequest"
      responses:
        "200":
          description: Opening hours updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  openingHours:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpeningHoursRecord"
                required: [openingHours]

  /owner/venues/{id}/pitches/{pitchId}/pricing:
    put:
      operationId: setPricingRules
      tags: [venues]
      summary: Replace pricing rules for a pitch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPricingRulesRequest"
      responses:
        "200":
          description: Pricing rules updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  pricingRules:
                    type: array
                    items:
                      $ref: "#/components/schemas/PricingRuleRecord"
                required: [pricingRules]

  # ── Availability ──────────────────────────────────────────────────────────
  /venues/{venueId}/pitches/{pitchId}/availability:
    get:
      operationId: getPitchAvailability
      tags: [venues]
      summary: Get available time slots for a pitch on a given date
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pitchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: Date in YYYY-MM-DD format
      responses:
        "200":
          description: Slot availability for the date
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items:
                      $ref: "#/components/schemas/SlotItem"
                required: [slots]
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pitch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Bookings ──────────────────────────────────────────────────────────────
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking for a pitch slot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    $ref: "#/components/schemas/BookingWithDetails"
                required: [booking]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Slot no longer available (double-booking prevented)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /player/bookings:
    get:
      operationId: listPlayerBookings
      tags: [bookings]
      summary: List bookings for the logged-in player
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: Player's bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingWithDetails"
                required: [bookings]

  /player/bookings/{id}:
    get:
      operationId: getPlayerBooking
      tags: [bookings]
      summary: Get a specific booking for the logged-in player
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    $ref: "#/components/schemas/BookingWithDetails"
                required: [booking]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/bookings:
    get:
      operationId: listOwnerBookings
      tags: [bookings]
      summary: List bookings across all venues owned by the current user
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Filter bookings starting at or after this datetime
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: Filter bookings starting at or before this datetime
        - name: pitchId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by a specific pitch
      responses:
        "200":
          description: Owner's bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingWithDetails"
                required: [bookings]

  /owner/stats:
    get:
      operationId: getOwnerStats
      tags: [bookings]
      summary: Get booking and revenue analytics for the current venue owner
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
          description: ISO 8601 datetime string. Include bookings starting at or after this value.
        - name: to
          in: query
          schema:
            type: string
          description: ISO 8601 datetime string. Include bookings starting at or before this value.
      responses:
        "200":
          description: Owner booking and revenue analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerStatsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Venue owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/bookings/manual:
    post:
      operationId: createManualBooking
      tags: [bookings]
      summary: Create a pending manual booking for offline payment (Pro or Elite)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualBookingInput"
      responses:
        "201":
          description: Pending manual booking created
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking:
                    $ref: "#/components/schemas/ManualBookingWithDetails"
        "400":
          description: Invalid guest or slot input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner lacks the MANUAL_BOOKING entitlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Slot is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/bookings/export.csv:
    get:
      operationId: exportOwnerBookings
      tags: [bookings]
      summary: Export privacy-safe owner booking revenue report as CSV
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: CSV booking export without guest contact details
          content:
            text/csv:
              schema:
                type: string

  /owner/bookings/{id}/confirm-offline-payment:
    post:
      operationId: confirmOfflinePayment
      tags: [bookings]
      summary: Confirm offline payment for a pending manual booking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Offline payment recorded and booking confirmed
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking:
                    $ref: "#/components/schemas/BookingRecord"
        "404":
          description: Booking not found or not owned by the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":

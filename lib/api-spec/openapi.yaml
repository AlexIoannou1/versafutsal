        "200": { description: Event reconciled }
        "400": { description: Invalid webhook request }

components:
  parameters:
    TournamentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SquadMemberInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
    Teammate:
      type: object
      required: [id, name, emailHint]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        emailHint: { type: string, description: Masked email suitable only to distinguish search results }
    TeammateSearchResult:
      type: object
      required: [players]
      properties:
        players: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Teammate" } }
    SquadAvailabilityInput:
      type: object
      additionalProperties: false
      required: [startAt, endAt]
      properties:
        pitchId: { type: ["string", "null"], format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        exactSlot: { type: boolean, default: false }
    SquadRequestInput:
      type: object
      additionalProperties: false
      required: [venueId, skillMin, skillMax, members, availability, expiresAt]
      properties:
        venueId: { type: string, format: uuid }
        skillMin: { type: integer, minimum: 1, maximum: 10 }
        skillMax: { type: integer, minimum: 1, maximum: 10 }
        members: { type: array, minItems: 5, maxItems: 5, items: { $ref: "#/components/schemas/SquadMemberInput" } }
        availability: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/SquadAvailabilityInput" } }
        expiresAt: { type: string, format: date-time }
    SquadRequest:
      type: object
      required: [id, captainId, venueId, skillMin, skillMax, status, expiresAt, createdAt, members, availability]
      properties:
        id: { type: string, format: uuid }
        captainId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        skillMin: { type: integer }
        skillMax: { type: integer }
        status: { type: string, enum: [DRAFT, PENDING, MATCHED, BOOKED, CANCELLED, EXPIRED] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        members: { type: array, items: { type: string, format: uuid } }
        availability: { type: array, items: { $ref: "#/components/schemas/SquadAvailabilityInput" } }
        proposal: { anyOf: [{ $ref: "#/components/schemas/MatchProposal" }, { type: "null" }] }
    SquadRequestList:
      type: object
      required: [requests]
      properties:
        requests: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/SquadRequest" } }
    MatchProposal:
      type: object
      required: [id, squadAId, squadBId, bookingId, status, squadAResponse, squadBResponse, expiresAt]
      properties:
        id: { type: string, format: uuid }
        squadAId: { type: string, format: uuid }
        squadBId: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, BOOKED, DECLINED, CANCELLED, EXPIRED] }
        squadAResponse: { type: string, enum: [PENDING, ACCEPTED, DECLINED] }
        squadBResponse: { type: string, enum: [PENDING, ACCEPTED, DECLINED] }
        expiresAt: { type: string, format: date-time }
    MatchProposalResponseInput:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response: { type: string, enum: [ACCEPTED, DECLINED] }
    WaitlistJoinInput:
      type: object
      additionalProperties: false
      required: [pitchId, startAt]
      properties:
        pitchId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
    WaitlistEntry:
      type: object
      required: [id, venueId, pitchId, userId, startAt, endAt, position, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        pitchId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        position: { type: integer }

      type: string
      minLength: 1
      maxLength: 32
      description: Phone number in international or local format; the API returns canonical E.164.

    PhoneNumberNullable:
      type: [string, "null"]
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: Canonical E.164 phone number, or null for a legacy account.


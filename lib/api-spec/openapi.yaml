        hoursUntilStart:
          type: number
          description: Hours remaining until the booking start at the time of cancellation.
      required: [booking]

    # ── Checkout & Payments ──────────────────────────────────────────────────

    CheckoutFeeResponse:
      type: object
      properties:
        feeEnabled:
          type: boolean
        feePercent:
          type: string
          description: Percentage of the booking subtotal charged as a service fee, e.g. "6.00" or "0.00"
      required: [feeEnabled, feePercent]

    CheckoutRequest:
      type: object
      properties:
        paymentType:
          type: string
          enum: [FULL, DEPOSIT]
          default: FULL
        idempotencyKey:
          type: string
          nullable: true
      required: [paymentType]

    PaymentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: string
        feeAmount:
          type: string
        feePercent:
          type: string
          description: The percentage rate applied to compute feeAmount at checkout time, e.g. "6.00"
        feeWaived:
          type: boolean
        paymentType:
          type: string
          enum: [FULL, DEPOSIT]
        currency:
          type: string
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, REFUNDED, PARTIALLY_REFUNDED]
        provider:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, amount, feeAmount, feePercent, feeWaived, paymentType, currency, status, provider, createdAt]

    CheckoutResponse:
      type: object
      properties:
        alreadyProcessed:
          type: boolean
        booking:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
          required: [id, status]
        payment:
          $ref: "#/components/schemas/PaymentRecord"
      required: [booking, payment]

    # ── Push Token ───────────────────────────────────────────────────────────

    RegisterPushTokenRequest:
      type: object
      properties:
        pushToken:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^(?:ExponentPushToken|ExpoPushToken)\[[A-Za-z0-9_-]+\]$'
          description: Expo push token, e.g. ExponentPushToken[...]
      required: [pushToken]

    # ── Admin Settings ────────────────────────────────────────────────────────

    AdminSettingsRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        feeEnabled:
          type: boolean
        feePercent:
          type: string
          description: Percentage of the booking subtotal charged as a service fee, e.g. "6.00"
        perVenueOverrides:
          type: object
          additionalProperties:
            type: boolean
          description: Map of venueId to feeEnabled override
        updatedAt:
          type: string
          format: date-time
      required: [id, feeEnabled, feePercent, perVenueOverrides, updatedAt]

    UpdateAdminSettingsRequest:
      type: object
      properties:
        feeEnabled:
          type: boolean
        feePercent:
          type: string
          pattern: '^(?:0|[1-9][0-9]{0,2})(\.[0-9]{1,2})?$'

    VenueFeeOverrideRequest:
      type: object
      properties:
        feeEnabled:
          type: boolean
          nullable: true
          description: "true = fee on, false = fee off, null = remove override"
